name: TaskFlow CI

on:
  push:
    branches: [master]


jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://taskflow:test_password@localhost:5432/taskflow_test
      TEST_DATABASE_URL: postgresql+psycopg://taskflow:test_password@localhost:5432/taskflow_test
      TASKFLOW_TESTING: "1"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: taskflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
      
      - name: Instalar dependencias
        run: uv sync --frozen
      
      - name: Verificar codigo com Ruff
        run: uv run ruff check .
      
      - name: Preparar banco de testes
        run: uv run alembic upgrade head
      
      - name: Executar testes automatizados
        run: uv run pytest -v